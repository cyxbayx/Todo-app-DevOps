name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install security tools & app deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt bandit pip-audit

      - name: SAST scan (bandit)
        run: |
          bandit -r app -f json -o bandit-report.json || true
          cat bandit-report.json

      - name: Dependency scan (pip-audit)
        run: pip-audit

      - name: Upload SAST report
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: bandit-report.json

  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          load: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ env.IMAGE_NAME }}:latest
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

  # =====================================================================
  # JOB DEPLOY (Fase A - standby). Cara kerja:
  #   1. GitHub runner masuk ke server via SSH (pakai secret key).
  #   2. Tarik image terbaru dari GHCR.  --> docker pull
  #   3. Restart container dengan image baru. --> docker compose up -d
